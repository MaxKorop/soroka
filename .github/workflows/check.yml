name: Check

# Required status check for PRs into main (see .github/rulesets/main.json).
# No `paths-ignore` here on purpose: a required check that is skipped never reports,
# and the PR would wait for it forever.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile and import
        run: |
          python -m compileall -q soroka
          python -c "import soroka.__main__"
