# Local Postgres for development. The bot itself runs from your venv: python -m soroka
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soroka
      POSTGRES_PASSWORD: soroka
      POSTGRES_DB: soroka
    ports:
      - "5432:5432"
    volumes:
      - soroka_pg:/var/lib/postgresql/data

volumes:
  soroka_pg:
